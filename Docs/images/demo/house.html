<!doctype html><html><head><style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<!-- A made-up ranch house at dusk for the README screenshots (not a real house). 1600 x 900. -->
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1230"/><stop offset="0.6" stop-color="#27325e"/><stop offset="1" stop-color="#4a3f63"/></linearGradient>
 <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4a2a"/><stop offset="1" stop-color="#16261a"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a40"/><stop offset="1" stop-color="#26262b"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6450"/><stop offset="1" stop-color="#6e4c3d"/></linearGradient>
 <linearGradient id="siding" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfcabd"/><stop offset="1" stop-color="#aaa597"/></linearGradient>
 <radialGradient id="win" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#d99a40"/></radialGradient>
 <radialGradient id="canopy" cx="0.45" cy="0.4" r="0.6"><stop offset="0" stop-color="#4a6b3a"/><stop offset="1" stop-color="#22351d"/></radialGradient>
 <pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="url(#wall)"/><path d="M0 10H40M20 0V10M0 10V20M40 10V20" stroke="#5a3d30" stroke-width="1.5" opacity="0.6"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<g fill="#fff" opacity="0.7"><circle cx="120" cy="60" r="1.6"/><circle cx="380" cy="110" r="1.2"/><circle cx="620" cy="50" r="1.5"/><circle cx="900" cy="90" r="1.1"/><circle cx="1180" cy="40" r="1.6"/><circle cx="1420" cy="120" r="1.3"/><circle cx="1540" cy="60" r="1.1"/><circle cx="760" cy="160" r="1"/></g>
<circle cx="1330" cy="120" r="34" fill="#f3eccf" opacity="0.85"/>
<!-- background trees -->
<g fill="#141d16"><ellipse cx="560" cy="330" rx="140" ry="90"/><ellipse cx="1060" cy="320" rx="160" ry="95"/><ellipse cx="1500" cy="360" rx="150" ry="110"/></g>
<rect y="560" width="1600" height="340" fill="url(#lawn)"/>
<!-- driveway -->
<path d="M1040 600 L1360 600 L1560 900 L860 900 Z" fill="#2b2b2e"/>
<path d="M700 610 L760 610 L820 900 L640 900 Z" fill="#3a3832"/>
<!-- house body -->
<rect x="230" y="440" width="760" height="170" fill="url(#brick)"/>
<rect x="990" y="440" width="390" height="170" fill="url(#siding)"/>
<!-- roof (hip) with overhang: eave line at y=440 -->
<path d="M190 446 L1420 446 L1300 330 L320 330 Z" fill="url(#roof)"/>
<path d="M600 446 L740 360 L880 446 Z" fill="#2f2f35"/>
<rect x="190" y="440" width="1230" height="10" fill="#1d1d21"/>
<!-- windows -->
<g><rect x="290" y="480" width="110" height="70" fill="url(#win)"/><rect x="440" y="480" width="110" height="70" fill="url(#win)"/>
<rect x="860" y="480" width="100" height="70" fill="url(#win)"/>
<g stroke="#5b4430" stroke-width="4" fill="none"><rect x="290" y="480" width="110" height="70"/><rect x="440" y="480" width="110" height="70"/><rect x="860" y="480" width="100" height="70"/>
<path d="M345 480V550M495 480V550M910 480V550"/></g></g>
<!-- porch and door -->
<rect x="660" y="470" width="160" height="140" fill="#2a2523"/>
<rect x="710" y="490" width="60" height="120" fill="#6a2f24"/><circle cx="760" cy="552" r="3" fill="#e8c070"/>
<g fill="#ddd6c8"><rect x="652" y="450" width="10" height="160"/><rect x="818" y="450" width="10" height="160"/></g>
<rect x="640" y="604" width="200" height="10" fill="#8f8a80"/>
<!-- garage -->
<rect x="1060" y="480" width="250" height="130" fill="#e7e2d6"/>
<g stroke="#bdb7a8" stroke-width="3"><path d="M1060 512H1310M1060 544H1310M1060 576H1310"/></g>
<!-- bushes -->
<g fill="#1f3320"><ellipse cx="300" cy="600" rx="70" ry="28"/><ellipse cx="460" cy="604" rx="80" ry="26"/><ellipse cx="900" cy="603" rx="60" ry="24"/></g>
<!-- big oak, left front -->
<path d="M150 900 L170 640 Q175 520 160 380 L195 380 Q190 520 205 640 L235 900 Z" fill="#3b2c22"/>
<path d="M175 520 Q120 420 80 360 M190 500 Q250 400 290 350" stroke="#3b2c22" stroke-width="14" fill="none"/>
<ellipse cx="150" cy="250" rx="220" ry="150" fill="url(#canopy)" opacity="0.95"/>
<!-- palm-like tree, right front: trunk + round top -->
<path d="M1488 840 Q1478 740 1494 640 Q1502 600 1496 560 L1512 560 Q1518 600 1510 640 Q1496 740 1508 840 Z" fill="#5a4636"/>
<circle cx="1503" cy="505" r="86" fill="url(#canopy)"/>
<ellipse cx="1500" cy="845" rx="60" ry="10" fill="#0f1a10"/>
</svg></body></html>
